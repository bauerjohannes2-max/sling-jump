<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#080b10" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Ambient Space Grid Lines -->
  <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- Outer Orbital Reticle Ring -->
  <circle cx="256" cy="275" r="160" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="275" r="120" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="3" />
  <circle cx="256" cy="275" r="48" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#cyanGlow)" />
  <circle cx="256" cy="275" r="16" fill="#ffffff" filter="url(#cyanGlow)" />

  <!-- Catapult Hook Tether Arc -->
  <path d="M256 275 Q210 210 235 150" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="6 4" filter="url(#cyanGlow)" />

  <!-- Spaceship Ascending Geometry -->
  <g transform="translate(235, 140) rotate(-18)">
    <!-- Engine Plasma Trail -->
    <path d="M-8 40 L0 80 L8 40 Z" fill="#38bdf8" opacity="0.6" filter="url(#cyanGlow)" />
    <path d="M-4 40 L0 65 L4 40 Z" fill="#ffffff" filter="url(#cyanGlow)" />
    <!-- Ship Hull -->
    <polygon points="0,-48 34,36 0,22 -34,36" fill="#0f172a" stroke="#00f0ff" stroke-width="6" stroke-linejoin="round" filter="url(#cyanGlow)" />
    <polygon points="0,-36 24,28 0,16 -24,28" fill="#1e293b" />
    <polygon points="0,-22 12,14 0,8 -12,14" fill="#38bdf8" />
  </g>

  <!-- Golden Coin / Star Trophy Spark -->
  <circle cx="345" cy="115" r="18" fill="#fbbf24" filter="url(#goldGlow)" />
  <circle cx="345" cy="115" r="10" fill="#fef08a" />
  <!-- Coin Detail Ring -->
  <circle cx="345" cy="115" r="14" fill="none" stroke="#d97706" stroke-width="1.5" />
</svg>
