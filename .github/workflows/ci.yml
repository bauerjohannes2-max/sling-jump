name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Version references in sync with package.json
        run: npm run version:check

      - name: Serve.js smoke test
        run: npm run test:smoke

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright visual suite
        run: npm test
